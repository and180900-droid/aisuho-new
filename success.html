<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 확인 중</title><style>body{margin:0;background:#f4f2ec;color:#171914;font-family:Arial,'Noto Sans KR',sans-serif}.box{max-width:560px;margin:12vh auto;background:white;padding:42px 30px;text-align:center}.mark{font-size:42px;color:#76933e}h1{font-size:25px}p{color:#777;line-height:1.8;font-size:14px}a{display:inline-block;background:#d7ff69;color:#171914;padding:14px 22px;text-decoration:none;font-weight:bold;margin-top:18px}</style></head><body><div class="box"><div class="mark">✓</div><h1 id="title">결제를 확인하고 있습니다.</h1><p id="message">결제 승인 결과를 확인하는 중입니다. 잠시만 기다려 주세요.</p><a href="index.html">클래스 홈페이지로</a></div><script>const q=new URLSearchParams(location.search);const paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=Number(q.get('amount'));async function confirm(){if(!paymentKey||!orderId||!amount){document.getElementById('title').textContent='결제 정보가 올바르지 않습니다.';document.getElementById('message').textContent='결제 내역을 확인할 수 없습니다. 운영자에게 문의해 주세요.';return}try{const r=await fetch('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentKey,orderId,amount})});const j=await r.json();if(!r.ok)throw new Error(j.error||'결제 승인에 실패했습니다.');document.getElementById('title').textContent='신청 및 결제가 완료되었습니다!';document.getElementById('message').textContent='주문번호: '+orderId+' · 결제금액: '+Number(j.amount).toLocaleString('ko-KR')+'원. 클래스 운영자가 신청 정보를 확인할 예정입니다.';}catch(e){document.getElementById('title').textContent='결제 확인이 필요합니다.';document.getElementById('message').textContent=e.message+' 결제 내역을 임의로 다시 결제하지 말고 운영자에게 문의해 주세요.'}}confirm();</script></body></html>
