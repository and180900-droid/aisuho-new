<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 실패</title><style>body{margin:0;background:#f4f2ec;color:#171914;font-family:Arial,'Noto Sans KR',sans-serif}.box{max-width:560px;margin:12vh auto;background:white;padding:42px 30px;text-align:center}.mark{font-size:42px;color:#b84b3d}h1{font-size:25px}p{color:#777;line-height:1.8;font-size:14px}a{display:inline-block;background:#171914;color:white;padding:14px 22px;text-decoration:none;font-weight:bold;margin-top:18px}</style></head><body><div class="box"><div class="mark">!</div><h1>결제가 완료되지 않았습니다.</h1><p id="msg">결제가 취소되었거나 처리 중 오류가 발생했습니다.</p><a href="payment.html">다시 신청하기</a></div><script>const q=new URLSearchParams(location.search);const m=q.get('message'),c=q.get('code');document.getElementById('msg').textContent=[m,c].filter(Boolean).join(' · ')||'결제가 취소되었거나 처리 중 오류가 발생했습니다.';</script></body></html>
